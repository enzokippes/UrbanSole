<nav class="navbar nav-blur">
  <div class="nav-container">
    <!-- Brand Logo -->
    <a routerLink="/catalog" class="brand-logo">
      <div class="logo-box">
        <span>US</span>
      </div>
      <span class="brand-title">URBAN<span class="brand-accent">SOLE</span></span>
    </a>

    <!-- Desktop Navigation Links -->
    <div class="desktop-nav">
      <a *ngFor="let cat of categories" 
         [routerLink]="['/catalog']" 
         [queryParams]="{ category: cat.query }" 
         class="nav-link">
        {{ cat.label }}
      </a>
    </div>

    <!-- Search Input Form -->
    <form (submit)="handleSearch($event)" class="search-form">
      <div class="search-input-wrapper">
        <svg class="search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input 
          type="text" 
          name="searchQuery" 
          [(ngModel)]="searchQuery" 
          placeholder="Buscar zapatillas, marcas..." 
          class="search-input"
          autocomplete="off"
        />
      </div>
    </form>

    <!-- Actions (User & Cart) -->
    <div class="nav-actions">
      <!-- User Menu -->
      <div *ngIf="authService.isAuthenticated(); else loginBtn" class="user-menu-container">
        <button (click)="userMenuOpen.set(!userMenuOpen())" class="icon-btn user-btn">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="action-icon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span class="user-name">{{ authService.currentUser()?.name }}</span>
        </button>

        <div *ngIf="userMenuOpen()" class="user-dropdown">
          <div class="dropdown-header">
            <p class="dropdown-name">{{ authService.currentUser()?.name }}</p>
            <p class="dropdown-email">{{ authService.currentUser()?.email }}</p>
            <span *ngIf="authService.isAdmin()" class="role-badge">Admin</span>
          </div>
          <button (click)="logout()" class="dropdown-item logout-btn">
            Cerrar Sesión
          </button>
        </div>
      </div>

      <ng-template #loginBtn>
        <a routerLink="/auth" class="login-link">
          Ingresar
        </a>
      </ng-template>

      <!-- Cart Trigger Button -->
      <button (click)="toggleCart()" class="icon-btn cart-btn" title="Carrito">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="action-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span *ngIf="cartService.count() > 0" class="cart-badge">
          {{ cartService.count() }}
        </span>
      </button>

      <!-- Mobile Menu Toggle -->
      <button (click)="mobileMenuOpen.set(!mobileMenuOpen())" class="icon-btn mobile-toggle">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="action-icon">
          <path *ngIf="!mobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          <path *ngIf="mobileMenuOpen()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown -->
  <div *ngIf="mobileMenuOpen()" class="mobile-menu">
    <div class="mobile-categories">
      <a *ngFor="let cat of categories" 
         [routerLink]="['/catalog']" 
         [queryParams]="{ category: cat.query }" 
         (click)="mobileMenuOpen.set(false)"
         class="mobile-link">
        {{ cat.label }}
      </a>
    </div>
  </div>
</nav>
