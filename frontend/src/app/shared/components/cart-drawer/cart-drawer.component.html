<div *ngIf="cartService.isOpen()" class="drawer-overlay" (click)="close()">
  <div class="drawer-content" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="drawer-header">
      <div class="header-left">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="drawer-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <h2 class="drawer-title">Tu Carrito ({{ cartService.count() }})</h2>
      </div>
      <button (click)="close()" class="close-btn">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="close-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Items List -->
    <div class="drawer-body">
      <div *ngIf="cartService.items().length === 0" class="empty-cart">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="empty-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <p class="empty-text">Tu carrito está vacío</p>
        <button (click)="close()" class="btn-secondary">Explorar Catálogo</button>
      </div>

      <div *ngFor="let item of cartService.items(); let i = index" class="cart-item">
        <img [src]="item.product.images?.[0] || '/images/jordan-chicago.jpg'" [alt]="item.product.name" class="item-img" />
        <div class="item-info">
          <h4 class="item-name">{{ item.product.name }}</h4>
          <p class="item-details">Talle: {{ item.size }} | Color: {{ item.color }}</p>
          <div class="item-bottom">
            <span class="item-price">${{ item.price * item.quantity | number:'1.2-2' }}</span>
            <div class="qty-controls">
              <button (click)="decrement(i, item.quantity)" class="qty-btn">-</button>
              <span class="qty-value">{{ item.quantity }}</span>
              <button (click)="increment(i, item.quantity)" class="qty-btn">+</button>
            </div>
            <button (click)="remove(i)" class="remove-btn" title="Eliminar">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" class="remove-icon">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div *ngIf="cartService.items().length > 0" class="drawer-footer">
      <div class="total-row">
        <span class="total-label">Total estimado:</span>
        <span class="total-price">${{ cartService.total() | number:'1.2-2' }}</span>
      </div>
      <button (click)="checkout()" class="btn-primary checkout-btn">
        Continuar Compra
      </button>
    </div>
  </div>
</div>
